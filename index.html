<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blindshot — aim without a cursor</title>
  <meta name="description" content="15 seconds. No cursor. Click the target. How good is your aim, really?">
  <meta property="og:title" content="blindshot">
  <meta property="og:description" content="15 seconds. No cursor. How good is your aim, really?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blindshot.gg/">
  <meta property="og:image" content="https://blindshot.gg/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://blindshot.gg/og.png">
  <meta name="theme-color" content="#efede8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FHYWJGQB1L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FHYWJGQB1L');
  </script>
</head>
<body>
  <main id="stage" aria-live="polite">
    <header class="hud">
      <span class="brand">blindshot</span>
      <span class="hud-time" id="time">15.00</span>
      <span class="hud-score"><span id="score">0</span> <small>hits</small></span>
    </header>

    <section class="screen" id="intro">
      <p class="kicker">aim trainer / cursor not included</p>
      <h1>You can't see<br>your mouse.</h1>
      <p class="lede">Targets appear. Your cursor doesn't. Click where you <em>think</em> you are. 15 seconds.</p>
      <button class="btn" id="start">Start <kbd>space</kbd></button>
      <p class="best" id="best-intro"></p>
      <p class="touch-note">Works best with a mouse. On touch it's a bit too easy.</p>
    </section>

    <section class="screen" id="results" hidden>
      <p class="kicker" id="rank">—</p>
      <div class="big"><span id="final">0</span><small>hits</small></div>
      <dl class="stats">
        <div><dt>accuracy</dt><dd id="acc">0%</dd></div>
        <div><dt>total off</dt><dd id="totaldist">—</dd></div>
        <div><dt>avg off</dt><dd id="avgdist">—</dd></div>
        <div><dt>best</dt><dd id="best">0</dd></div>
      </dl>
      <div class="row">
        <button class="btn" id="again">Again <kbd>space</kbd></button>
        <button class="btn ghost" id="share">Share score</button>
      </div>
    </section>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card">
        <img id="card-img" alt="Your blindshot score card">
        <div class="row">
          <button class="btn" id="copy-img">Copy image</button>
          <a class="btn ghost" id="dl-img" download="blindshot.png">Download</a>
          <button class="btn ghost" id="copy-link">Copy link</button>
          <button class="btn ghost" id="close-sheet" aria-label="Close">Close <kbd>esc</kbd></button>
        </div>
        <p class="toast" id="sheet-toast" hidden></p>
      </div>
    </div>

    <div class="count" id="count" hidden>3</div>
    <div class="target" id="target" hidden></div>
    <div id="fx"></div>
  </main>

  <script src="card.js"></script>
  <script src="main.js"></script>
</body>
</html>
