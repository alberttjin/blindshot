<!doctype html>
<!-- Source for og.png. Regenerate with tools/make-og.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  #og {
    position: fixed; inset: 0;
    padding: 56px 72px;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: -1px -1px;
  }
  .top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 26px; }
  .top b { letter-spacing: -0.02em; }
  .top span { color: var(--muted); }
  h1 { font-size: 132px; margin: 92px 0 36px; }
  .cta { font-family: var(--mono); font-size: 28px; }
  .cta em { font-style: normal; background: var(--ink); color: var(--bg); padding: 2px 10px; }
  .t {
    position: absolute; left: 1010px; top: 300px;
    --r: 56px;
  }
  .t .target, .t .ghost-target, .t .miss { animation: none; position: absolute; }
  .t .target { left: 0; top: 0; }
  .t .ghost-target { opacity: 1; }
  .t .miss { width: 26px; height: 26px; margin: -13px 0 0 -13px; }
  .t .miss::before, .t .miss::after { width: 3px; margin-left: -1.5px; }
</style>
</head>
<body>
  <div id="og">
    <div class="top"><b>blindshot</b><span>aim trainer / cursor not included</span></div>
    <h1>You can't see<br>your mouse.</h1>
    <div class="cta">15 seconds. how many can you hit? <em>blindshot.gg</em></div>
    <div class="t">
      <div class="target"></div>
      <div class="ghost-target" style="left:-170px;top:150px"></div>
      <div class="miss" style="left:-110px;top:-120px"></div>
      <div class="miss" style="left:95px;top:85px"></div>
      <div class="miss" style="left:-60px;top:215px"></div>
    </div>
  </div>
</body>
</html>
